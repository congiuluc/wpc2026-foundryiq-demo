<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fd">
  <title>WPC 2026 · Foundry IQ trace visualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,sans-serif' font-size='11' font-weight='800' fill='white' text-anchor='middle'%3EIQ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">WPC<small>2026</small></div>
      <div>
        <h1><span class="grad">Foundry IQ</span> Trace Visualizer</h1>
        <p class="subtitle">Tool call, risposte e fonti recuperate dagli agenti</p>
      </div>
    </div>
    <div class="user-nav">
      <nav class="nav"><a href="/">Chat</a><a href="/trace" aria-current="page">Trace</a></nav>
      <div class="stage-tools" role="group" aria-label="Presentazione">
        <button id="zoom-out" type="button" class="icon-button" title="Riduci testo (Alt+-)" aria-label="Riduci testo">A−</button>
        <button id="scale-label" type="button" class="icon-button scale-label" title="Ripristina dimensione (Alt+0)">100%</button>
        <button id="zoom-in" type="button" class="icon-button" title="Ingrandisci testo (Alt+=)" aria-label="Ingrandisci testo">A+</button>
        <button id="stage-toggle" type="button" class="icon-button" aria-pressed="false">⛶ <span>Presenta</span></button>
      </div>
      <button id="theme-toggle" type="button" class="icon-button">☀</button>
    </div>
  </header>

  <div class="page container">
    <section class="trace-hero">
      <span class="eyebrow"><span class="dot"></span>Analisi locale nel browser</span>
      <h2>Cosa ha recuperato l'agente?</h2>
      <p>Incolla o trascina una traccia per vedere fonti, pagine e snippet restituiti da Foundry IQ.</p>
    </section>

    <section class="trace-input">
      <textarea id="trace-text" rows="7" spellcheck="false"
        placeholder="Incolla una traccia JSON: un messaggio {role, parts}, un array di messaggi, un oggetto con 'messages' oppure JSON Lines. Puoi anche trascinare qui un file."></textarea>
      <div class="trace-actions">
        <button id="parse" type="button">Visualizza</button>
        <label class="file-button">📂 Apri file…<input id="file" type="file" accept=".json,.jsonl,.txt" hidden></label>
        <button id="clear" type="button" class="secondary">Pulisci</button>
        <span class="meta">🔒 La traccia non viene inviata al server.</span>
      </div>
    </section>
    <div id="trace-error" class="warning" hidden style="margin-top:12px"></div>

    <section id="trace-toolbar" class="controls" hidden>
      <div id="stats" class="stats"></div>
      <fieldset>
        <legend>Vista</legend>
        <div class="segmented">
          <label><input type="radio" name="view" value="timeline" checked> Cronologia</label>
          <label><input type="radio" name="view" value="documents"> Per documento</label>
        </div>
      </fieldset>
      <label>Filtro <input id="filter" type="search" placeholder="testo nelle fonti…"></label>
      <label class="check"><input id="raw" type="checkbox"> Testo grezzo</label>
      <span class="spacer"></span>
      <button id="toggle-all" type="button" class="secondary">Espandi tutto</button>
    </section>

    <main id="trace-view"></main>
  </div>

  <script src="/static/trace-parser.js"></script>
  <script src="/static/trace.js"></script>
</body>
</html>
