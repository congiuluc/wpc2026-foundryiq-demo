# GitHub Pages site. The source folder is generated by scripts/build_docs.py from the README files.
site_name: WPC 2026 · Foundry IQ Demo
site_description: Demo Foundry IQ con knowledge base, server MCP ricambi, agenti Foundry, ACL per documento e chat web.
site_url: https://congiuluc.github.io/wpc2026-foundryiq-demo/
repo_url: https://github.com/congiuluc/wpc2026-foundryiq-demo
repo_name: congiuluc/wpc2026-foundryiq-demo
edit_uri: edit/main/
docs_dir: .site-src
site_dir: site

nav:
  - Panoramica: README.md
  - Infrastruttura e deploy: infra/README.md
  - MCP server ricambi: mcp-ricambi/README.md
  - Agenti Foundry: agents/README.md
  - Chat web app: webapp-chat/README.md
  - Notebook deploy e demo: notebooks/README.md
  - Demo HTTP: http/README.md
  - Demo live e video offline: docs/demo-guide.md
  - Guida SharePoint: data/sharepoint/foundry-iq-sharepoint-remote-knowledge-source.md
  - Contribuire: CONTRIBUTING.md
  - Sicurezza: SECURITY.md

theme:
  name: material
  language: it
  font:
    text: Segoe UI
    code: Cascadia Code
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - docs/site/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
